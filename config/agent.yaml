# Agent Manifest — AgentRegistry entry point
# AgentRegistry reads every key below at ROOT level — do NOT nest keys under an
# `agent:` block. Runtime parameters live in config/config.yaml.
id: "MFG-C2-143"
name: "Manufacturing RoHS/REACH Material Declaration Completeness Agent"
namespace: "mfg"
version: "0.1.0"
enabled: true
category: "Cat 2"
generation_mode: "deterministic"
