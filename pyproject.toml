[project]
name = "MFG-C2-143"
version = "0.1.0"
description = "Manufacturing RoHS/REACH Material Declaration Completeness Agent — reconciles a product BOM against supplier material declarations and a RoHS/REACH substance/exemption index to produce a traceable evidence matrix and reviewer-ready remediation brief"
requires-python = ">=3.11"
# The framework is installed from the internal AgentCore package registry, which
# is configured as the install index in CI and in the deploy image build.
dependencies = [
    "agenticstar-agentcore[openai,marketplace]==1.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[tool.uv]
# agenticstar-agentcore's published package-index metadata can pin a
# langchain-core version incompatible with what its own "openai" extra
# (-> langchain-openai) requires. Force the SDK-compatible version the
# agentcore release actually ships with; re-verify this pin if the
# agenticstar-agentcore version above ever changes.
override-dependencies = [
    "langchain-core==1.5.4",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

# The installed agenticstar-agentcore wheel ships no py.typed marker, so its
# modules are untyped to mypy and subclassing them would otherwise be flagged.
[[tool.mypy.overrides]]
module = ["framework.*", "shared.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["src.*"]
disallow_subclassing_any = false
